# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:schultraeger}
quarkus.datasource.password=${DB_PASSWORD:schultraeger}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:schultraeger}

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.validate-on-migrate=false
quarkus.hibernate-orm.database.generation=none

# OIDC / JWT
quarkus.oidc.enabled=${OIDC_ENABLED:false}
quarkus.oidc.auth-server-url=${OIDC_URL:}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:}
quarkus.oidc.tenant-enabled=false

# JWT signing and verification for password-based authentication  
# Disable JWT as a security provider - we handle JWT validation manually
quarkus.smallrye-jwt.enabled=false
quarkus.smallrye-jwt.sign.key=${JWT_SIGN_KEY:}

# Logging
quarkus.log.console.json=false
quarkus.log.level=INFO
quarkus.log.category."de.schultraeger".level=DEBUG

# REST client timeouts (MVP defaults)
quarkus.rest-client.connect-timeout=5000
quarkus.rest-client.read-timeout=10000

# SVWS password encryption (base64-encoded 32-byte key)
svws.password.key=${SVWS_PASSWORD_KEY:}

# SVWS client SSL (set to true for self-signed certificates in dev)
svws.client.trust-all=${SVWS_TRUST_ALL:false}

# REST client SSL configuration (trust all certificates when enabled)
quarkus.rest-client.verify-host=${SVWS_TRUST_ALL:true}
quarkus.tls.trust-all=${SVWS_TRUST_ALL:false}

# Vert.x client SSL options (disable certificate validation in dev)
quarkus.http-client.verify-host=%dev.false
quarkus.http-client.trust-all=%dev.true

# CORS for frontend access
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:8081
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=authorization,content-type

# Security: Explicitly allow public access to auth endpoints
quarkus.http.auth.permission.auth-login.paths=/api/auth/login
quarkus.http.auth.permission.auth-login.policy=permit
quarkus.http.auth.permission.auth-register.paths=/api/auth/register
quarkus.http.auth.permission.auth-register.policy=permit
