services:
  database:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-schultraeger}
      POSTGRES_USER: ${DB_USER:-schultraeger}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-schultraeger}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  osrm:
    image: osrm/osrm-backend:latest
    volumes:
      - ./docker/osrm_data:/data
    ports:
      - "5000:5000"
    command: >
      bash -c 'set -e; cd /data &&
      INPUT_FILE="";
      if [ -f germany-latest.osm.pbf ]; then INPUT_FILE="germany-latest.osm.pbf"; fi;
      if [ -f germany-latest.osm.pbf.1 ]; then INPUT_FILE="germany-latest.osm.pbf.1"; fi;
      if [ -z "$$INPUT_FILE" ]; then
        echo "[error] Input file germany-latest.osm.pbf (or .1) not found in /data";
        exit 1;
      fi;
      BASE_FILE="germany-latest.osrm";
      if [ ! -f "$$BASE_FILE.hsgr" ]; then
        echo "Processing OSM data from $$INPUT_FILE...";
        osrm-extract -p /opt/car.lua "$$INPUT_FILE";
        osrm-contract "$$BASE_FILE";
        echo "OSM data ready!";
      fi;
      echo "Starting OSRM server on port 5000...";
      osrm-routed "$$BASE_FILE"'

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-schultraeger}
      DB_USER: ${DB_USER:-schultraeger}
      DB_PASSWORD: ${DB_PASSWORD:-schultraeger}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_URL: ${OIDC_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      JWT_SIGN_KEY: ${JWT_SIGN_KEY:-}
      SVWS_PASSWORD_KEY: ${SVWS_PASSWORD_KEY:-}
      SVWS_TRUST_ALL: ${SVWS_TRUST_ALL:-true}
      GRAPHHOPPER_URL: ${GRAPHHOPPER_URL:-http://osrm:5000}
    extra_hosts:
      - "svws-server:172.17.0.1"
    depends_on:
      - database
      - osrm

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend

  reverse-proxy:
    image: nginx:1.27
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  db_data:
