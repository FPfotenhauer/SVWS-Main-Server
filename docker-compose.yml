services:
  database:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-schultraeger}
      POSTGRES_USER: ${DB_USER:-schultraeger}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-schultraeger}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-schultraeger}
      DB_USER: ${DB_USER:-schultraeger}
      DB_PASSWORD: ${DB_PASSWORD:-schultraeger}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_URL: ${OIDC_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      JWT_SIGN_KEY: ${JWT_SIGN_KEY:-}
      SVWS_PASSWORD_KEY: ${SVWS_PASSWORD_KEY:-}
      SVWS_TRUST_ALL: ${SVWS_TRUST_ALL:-true}
    extra_hosts:
      - "svws-server:172.17.0.1"
    depends_on:
      - database

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend

  reverse-proxy:
    image: nginx:1.27
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  db_data:
